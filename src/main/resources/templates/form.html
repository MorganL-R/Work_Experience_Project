<label for="username"> Enter Username:</label>

<br>

<input
        type="text"
        id="username"
        name="username"
        required
        minlength="4"
        maxlength="8"
        size="10" />

<br>

<label for="name"> Enter your Name:</label>

<br>

<input
        type="text"
        id="name"
        name="name"
        required
        minlength="4"
        maxlength="8"
        size="10" />

<br>

<label for="phoneNumber"> Enter Phone Number:</label>

<br>

<input
        type="text"
        id="phoneNumber"
        name="phoneNumber"
        required
        minlength="11"
        maxlength="15"
        size="10" />

<br>

<label for="dob"> Enter your birthdate:</label>

<br>

<input
        type="date"
        name="dob"
        id="dob"/>
