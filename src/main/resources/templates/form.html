<!DOCTYPE html>
<head>
    <link rel="stylesheet" href="../static/styleSheet.css">
    <meta charset="UTF-8">
    <title>Submit</title>
    <p> Submit </p>
</head>


<body>

    <form action="../templates/accepted.html" method="POST">
        <br>
        <div id="nameInput">

            <label for="name"> Enter your Name:</label>
            <br>
            <input
                    type="text"
                    id="name"
                    name="name"
                    required
                    minlength="2"
                    maxlength="100"
                    size="10" />
        </div>
        <br>
        <div id="phoneNumberInput">

            <label for="phoneNumber"> Enter Phone Number:</label>
            <br>
            <input
                    type="text"
                    id="phoneNumber"
                    name="phoneNumber"
                    required
                    minlength="10"
                    maxlength="15"
                    size="10" />
        </div>
        <br>
        <div id="dobInput">
        <label for="dob"> Enter your birthdate:</label>
        <br>
            <input
                    type="date"
                    name="dob"
                    id="dob"/>
        </div>
        <br>
        <div id="submitInput">
            <input type="submit" value="Send Request" />
        </div>
        <a id="SuperSecretlink" href="accepted.html">super duper secret link nobody will ever find</a>
    </form>

</body>
</html>
