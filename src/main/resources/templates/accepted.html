<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accepted</title>
    <link rel="stylesheet" href="temp/styleSheetAccepted.css">
</head>
<body>

<main class="accepted-page">
    <header class="page-heading">
        <p class="eyebrow">Account Setup</p>
        <h1>Registration Accepted</h1>
        <p class="heading-text">Your account details have been received successfully.</p>
    </header>

    <section class="accepted-card" aria-labelledby="accepted-message">
        <p id="accepted-message" class="success-message">
            Your registration was successful.
        </p>

        <div class="response-list">
            <p class="response-row">
                <span class="response-label">Username</span>
                <span class="response-display" th:text="${username}">Username</span>
            </p>

            <p class="response-row">
                <span class="response-label">Email</span>
                <span class="response-display" th:text="${email}">Email address</span>
            </p>

            <p class="response-row">
                <span class="response-label">Age</span>
                <span class="response-display" th:text="${age}">Age</span>
            </p>

            <p class="response-row">
                <span class="response-label">Birthday</span>
                <span class="date-wrapper">
                    <span class="response-display" th:text="${dob}">Date of birth</span>
                    <span id="dateformat">(DD/MM/YYYY)</span>
                </span>
            </p>

            <p class="response-row">
                <span class="response-label">Phone Number</span>
                <span class="response-display" th:text="${phoneNumber}">Phone number</span>
            </p>
        </div>
    </section>

    <a href="/form" class="previous-link">&larr; Previous</a>
</main>

</body>
</html>
