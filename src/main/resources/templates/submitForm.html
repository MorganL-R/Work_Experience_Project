<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Registration</title>


    <link rel="stylesheet" href="css/styleSheet.css">
</head>
<body>

<main class="registration-page">
    <header class="page-heading">
        <p class="eyebrow">Account Setup</p>
        <h1>User Registration</h1>
        <p class="heading-text">Enter your details below to create your account.</p>
    </header>

    <form action="/submitForm" method="post">
        <div class="form-group full-width">
            <label for="nameField">Full Name</label>
            <input
                    type="text"
                    id="nameField"
                    name="name"
                    placeholder="Enter your full name"
                    autocomplete="name"
                    required>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="emailField">Email Address</label>
                <input
                        type="email"
                        id="emailField"
                        name="email"
                        placeholder="name@example.com"
                        autocomplete="email"
                        required>
            </div>

            <div class="form-group">
                <label for="phoneNumberField">Phone Number</label>
                <input
                        type="tel"
                        id="phoneNumberField"
                        name="phoneNumber"
                        placeholder="Enter your phone number"
                        autocomplete="tel"
                        required>
            </div>
        </div>

        <div class="form-group full-width">
            <label for="dobField">Date of Birth</label>
            <input
                    type="date"
                    id="dobField"
                    name="dob"
                    autocomplete="bday"
                    required>
            <small>Date format: DD/MM/YYYY</small>
        </div>

        <input type="submit" class="submit-button" value="Create Account">
    </form>

    <a href="#" class="previous-link">&larr; Previous</a>
</main>

</body>
</html>
