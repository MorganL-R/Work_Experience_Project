<!DOCTYPE html>
<head>
    <link rel="stylesheet" href="css/styleSheet.css">
    <meta charset="UTF-8">
    <title>Submit</title>
    <p> Submit </p>
</head>
<body>


<form action="/submitForm" method="post">
    <span id="nameInput" class="border">

            <group for="name"> Enter your Name:</group>


            <input
                    type="text"
                    id="name"
                    name="name"
                    required
                    minlength="2"
                    maxlength="100"
                    size="10" />
        </span>



    <span id="phoneNumberInput" class="border">

                <group for="phoneNumber"> Enter Phone Number:</group>
                <br>
                <input
                        type="text"
                        id="phoneNumber"
                        name="phoneNumber"
                        required
                        minlength="10"
                        maxlength="15"
                        size="10" />
            </span>
    <br>
    <span id="dobInput" class="border">
            <group for="dob"> Enter your birthdate:</group>
            <br>
                <input
                        type="date"
                        name="dob"
                        id="dob"/>
            </span>
    <br>
    <br>

    <span id="submitInput" class="border">
                <input type="submit" value="Send Request" />
         </span>

</form>
